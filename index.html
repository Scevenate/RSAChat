<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/icon.svg" />
    <title>RSAChat</title>
    <meta name="description" content="Static web tool for local chats encyrption. Use pqc to exchange secrets over insecure chats.">
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/index.ts" defer></script>
  </head>
  <body>
      <section id="left">
          <textarea class="code scroller" id="left-textarea"></textarea>
          <footer>
              <p id="left-p"></p>
              <button id="left-button">Confirm</button>
          </footer>
      </section>
      <section id="middle">
          <main id="main" class="scroller">
          </main>
          <textarea class="text scroller" id="middle-textarea"></textarea>
          <footer>
              <div>
                  <label for="file">File: </label>
                  <input type="file" id="middle-file" multiple/>
              </div>
              <button id="middle-button">Send</button>
          </footer>
      </section>
      <section id="right">
          <textarea class="code scroller" id="right-textarea"></textarea>
          <footer>
              <p id="right-p"></p>
              <button id="right-button">Confirm</button>
          </footer>
      </section>
  </body>
</html>
